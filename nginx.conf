# nginx config for the static resolve.works site.
# TLS terminates upstream, so this only listens on :80 and serves files.

# This file is included from the http context, where map must live.
map $http_accept $preferred_ext {
    default           ".html";
    "~*text/markdown" ".md";
}

# At the same http context as the stock mime.types, this extends its table.
types {
    text/markdown md;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root   /usr/share/nginx/html;
    charset utf-8;

    # The charset directive only covers the default charset_types (html, xml,
    # plain, js, rss); add markdown so .md responses get "charset=utf-8" too.
    charset_types text/markdown;

    # Directory requests resolve to index.html (trailingSlash='always' output).
    index  index.html;

    # --- gzip text-based responses --------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/markdown
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # --- fingerprinted build assets: content-hashed, immutable cache ---------
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- embeddings.json: regenerated when content changes, never cache --------
    location = /embeddings.json {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # --- Pages and everything else: never cache so new deploys are picked up ---
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Vary Accept always;
        try_files ${uri}index$preferred_ext $uri$preferred_ext $uri $uri/ =404;
    }

    # --- custom error pages ----------------------------------------------------
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /50x.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}
